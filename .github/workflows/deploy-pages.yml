name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate site
        run: node scripts/build-site.mjs --check && node tests/build-site-contract.mjs && node tests/check-site.mjs && node tests/check-site-contract.mjs
      - name: Run browser smoke tests
        run: node tests/server-lifecycle.mjs && node tests/browser-isolation.mjs && node tests/theme-smoke.mjs && node tests/interaction-contract.mjs && node tests/browser-smoke.mjs && node tests/glyph-site-placement.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
