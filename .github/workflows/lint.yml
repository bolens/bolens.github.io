name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the stable protection and Pages gate, joined to actual native work.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify native-status handoff boundaries
        run: python3 -m unittest discover -s scripts -p 'test_woodpecker_handoff.py' -v
      - name: Require exact-revision Woodpecker validation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/wait-for-woodpecker.py
