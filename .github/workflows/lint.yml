name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Lint
        run: node scripts/lint.mjs
      - name: Tests
        run: node --test --test-concurrency=2 --test-timeout=60000 tests/*.mjs
